<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: high-res 192px PNG first so the tab icon renders sharp
         on retina displays (the old 64px PNG was padded and small, so
         it looked pixelated). The multi-size ICO (16/32/48) is the
         fallback for older browsers. Fixed 2026-11-13. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030303" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Open Graph (2026-11-13): WhatsApp link previews had no tags to
         read, so they repeated the domain as title and description.
         These tags make the preview show the proper name instead. -->
    <meta name="description" content="Meridian- Azure Analytics tracker" />
    <meta property="og:title" content="Meridian- Azure Analytics Tracker" />
    <meta property="og:description" content="Meridian- Azure Analytics tracker" />
    <meta property="og:url" content="https://meridian.isthatabbhi.tech/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://meridian.isthatabbhi.tech/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Meridian- Azure Analytics Tracker" />
    <meta name="twitter:description" content="Meridian- Azure Analytics tracker" />
    <meta name="twitter:image" content="https://meridian.isthatabbhi.tech/favicon.png" />
    <title>Meridian- Azure Analytics Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
